# Критерии rule-based скоринга вакансий (пример — настройте под себя)

profile:
  name: "Your Name"
  title: "Product Manager"
  experience_years: 5
  resume_url: ""

must_match:
  - "product manager"
  - "продакт"
  - "product owner"
  - "head of product"
  - "lead product"

boost:
  - "b2b saas"
  - "saas"
  - "маркетплейс"
  - "marketplace"
  - "e-commerce"
  - "fintech"
  - "unit economics"

penalty:
  - "junior"
  - "стажёр"
  - "intern"
  - "без опыта"
  - "project manager"
  - "scrum master"

locations:
  - "москва"
  - "удалённо"
  - "remote"
  - "гибрид"
  - "hybrid"

thresholds:
  min_score: 40
  priority_score: 55
  max_age_days: 14

cover_letter:
  max_sentences: 9
  must_mention: []
  tone: "структурный шаблон, факты, без пафоса, русский"
