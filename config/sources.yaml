# Браузер для обогащения (полное описание вакансий)
browser:
  engine: requests       # auto | camoufox | drission | requests
  headless: true
  use_for_scan: true     # открывать карточки вакансий через HTTP (requests)
  delay_seconds: 2
  enrich_limit: 30

sources:
  hh_parser:
    enabled: true
    pages_per_query: 2
    delay_seconds: 2
    search_period: 7   # только вакансии за последние N дней (1/3/7/30)
    queries:
      - text: "product manager"
        area: 1
        search_field: name
      - text: "продакт менеджер"
        area: 1

  manual:
    enabled: true
